version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 3
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 3
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
