name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version. Leave blank to use manifest.json.
        required: false
        type: string
      force:
        description: Rebuild and replace assets for an existing release.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - versions.json
      - src/**
      - tests/**
      - scripts/**
      - .github/workflows/release.yml

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Determine release version
        id: release-version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          VERSION="$REQUESTED_VERSION"
          if [ -z "$VERSION" ]; then VERSION="$MANIFEST_VERSION"; fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release version $VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release version must use x.y.z without a v prefix"
            exit 1
          fi

          git fetch --tags --force
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then TAG_EXISTS=true; fi
          RELEASE_EXISTS=false
          if gh release view "$VERSION" >/dev/null 2>&1; then RELEASE_EXISTS=true; fi
          SHOULD_RELEASE=true
          if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ] && [ "$FORCE_RELEASE" != "true" ]; then
            echo "Release $VERSION already exists. Nothing to publish."
            SHOULD_RELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check out existing release tag
        if: steps.release-version.outputs.should_release == 'true' && steps.release-version.outputs.tag_exists == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: git checkout --detach "$VERSION"

      - name: Install dependencies
        if: steps.release-version.outputs.should_release == 'true'
        run: npm ci

      - name: Validate and package
        if: steps.release-version.outputs.should_release == 'true'
        run: |
          npm run validate
          npm run package

      - name: Attest release assets
        if: steps.release-version.outputs.should_release == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create matching tag
        if: steps.release-version.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
          TAG_EXISTS: ${{ steps.release-version.outputs.tag_exists }}
        run: |
          if [ "$TAG_EXISTS" = "false" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi

      - name: Create or repair GitHub release
        if: steps.release-version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          ZIP="dist/document-pdf-exporter-$VERSION.zip"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css "$ZIP" --clobber
          else
            gh release create "$VERSION" \
              main.js manifest.json styles.css "$ZIP" \
              --verify-tag \
              --title "$VERSION" \
              --generate-notes
          fi
