name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave blank to derive it from manifest.json.
        required: false
        type: string
      force:
        description: Rebuild and replace assets for an existing release.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - versions.json
      - src/**
      - tests/**
      - scripts/**
      - .github/workflows/release.yml

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Determine release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          IFS=. read -r MAJOR MINOR PATCH <<< "$MANIFEST_VERSION"
          if [ -n "$REQUESTED_TAG" ]; then TAG="$REQUESTED_TAG"; elif [ "$PATCH" = "0" ]; then TAG="v$MAJOR.$MINOR"; else TAG="v$MANIFEST_VERSION"; fi
          NORMALIZED="${TAG#v}"
          if printf '%s' "$NORMALIZED" | grep -Eq '^[0-9]+\.[0-9]+$'; then NORMALIZED="$NORMALIZED.0"; fi
          if [ "$NORMALIZED" != "$MANIFEST_VERSION" ]; then echo "Release tag $TAG normalizes to $NORMALIZED, but manifest.json is $MANIFEST_VERSION"; exit 1; fi
          git fetch --tags --force
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then TAG_EXISTS=true; fi
          RELEASE_EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then RELEASE_EXISTS=true; fi
          SHOULD_RELEASE=true
          if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ] && [ "$FORCE_RELEASE" != "true" ]; then SHOULD_RELEASE=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Check out existing release tag
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.tag_exists == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$TAG"
      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci
      - name: Validate and package
        if: steps.release.outputs.should_release == 'true'
        run: |
          npm run validate
          npm run package
      - name: Attest release assets
        if: steps.release.outputs.should_release == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create matching tag
        if: steps.release.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          if [ "$TAG_EXISTS" = "false" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Create or repair GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          ZIP="dist/document-pdf-exporter-1.0.0.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css "$ZIP" --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css "$ZIP" --verify-tag --title "$TAG" --generate-notes
          fi
